name: Deploy landing page

# Publishes apps/site to GitHub Pages at https://pinpoint.qolso.com/
# Activated by the repo owner once the repository is public and Pages is set to
# "GitHub Actions". All asset links in the site are relative, so the /pinpoint/
# project path works without changes.

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
