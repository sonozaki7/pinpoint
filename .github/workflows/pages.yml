name: Deploy simulator site

# Builds apps/web (Vite + TypeScript) into the GitHub Pages artifact at
# https://pinpoint.qolso.com/. Static assets (fonts, media, OG image, favicon,
# CNAME) still live in apps/site; Vite copies them into the built output.
# Build output is never committed.

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/site/**"
      - "shared/**"
      - "apps/glasses/src/**"
      - "apps/server/src/core/**"
      - "apps/server/src/cloud/reply.ts"
      - "demo/fixtures/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/glasses/package-lock.json

      - name: Install simulator dependencies
        # The simulator imports the real glasses app code, which needs the Even Hub SDK types.
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/glasses

      - name: Build site
        run: npm run build --prefix apps/web

      - name: Check deployed files
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/CNAME
          test -f apps/web/dist/media/og.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
